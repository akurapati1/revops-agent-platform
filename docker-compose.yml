# docker compose up --build      -> web on :3000, api on :8000
# Copy .env.example to .env to override anything below (e.g. LLM_PROVIDER=openrouter + OPENROUTER_API_KEY).
x-api-env: &api-env
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://revops:revops@postgres:5432/revops
  REDIS_URL: redis://redis:6379/0
  AUTO_CREATE_TABLES: "false"
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  MODEL_DEFAULT: ${MODEL_DEFAULT:-openai/gpt-4o-mini}
  MODEL_PERSONALIZER: ${MODEL_PERSONALIZER:-anthropic/claude-3.5-haiku}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM: ${EMAIL_FROM:-RevOps Agent <no-reply@example.com>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revops
      POSTGRES_PASSWORD: revops
      POSTGRES_DB: revops
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    healthcheck: {disable: true}
    environment: *api-env
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
